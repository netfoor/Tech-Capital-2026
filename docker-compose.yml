services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pueblaviva
      POSTGRES_PASSWORD: pueblaviva
      POSTGRES_DB: pueblaviva
    ports:
      - "${DB_PUERTO:-5433}:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pueblaviva"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pueblaviva:pueblaviva@db:5432/pueblaviva
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  datos_db:
