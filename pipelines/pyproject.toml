[project]
name = "radar"
version = "0.1.0"
description = "Ingesta, análisis y exportación de datos del Radar de Atención Turística de Puebla"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "jsonschema>=4.23",
    "referencing>=0.35",
]

[project.optional-dependencies]
senales = [
    "pytrends>=4.9.2",
    "httpx>=0.27",
]
asistentes = [
    "openai>=1.50",
    "google-genai>=1.0",
]

[project.scripts]
radar = "radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
