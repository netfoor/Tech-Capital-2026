[project]
name = "puebla-viva-backend"
version = "0.1.0"
description = "API de Puebla Viva 360: catálogo, recomendador, visitas consentidas y tablero institucional"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.16",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.15.1",
    "argon2-cffi>=25.1.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
